name: Reading regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugo with verified release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          gh release download v0.147.7 -R gohugoio/hugo -p hugo_extended_0.147.7_linux-amd64.tar.gz -p hugo_0.147.7_checksums.txt
          python -c "from pathlib import Path; import hashlib; p=Path('hugo_extended_0.147.7_linux-amd64.tar.gz'); expected=next(l.split()[0] for l in Path('hugo_0.147.7_checksums.txt').read_text().splitlines() if l.split()[-1]==p.name); assert hashlib.sha256(p.read_bytes()).hexdigest()==expected"
          tar -xzf hugo_extended_0.147.7_linux-amd64.tar.gz hugo
      - name: Install browser test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build and exercise the reading experience
        env:
          HUGO_BIN: ${{ runner.temp }}/hugo/hugo
        run: python scripts/test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporal cursor test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/cursor-tools" playwright@1.62.0
          pip install Pillow==11.3.0
      - name: Verify temporal website cursor pixels
        run: |
          "$RUNNER_TEMP/hugo/hugo" --gc --minify --destination "$RUNNER_TEMP/cursor-site"
          python -m http.server 8767 --bind 127.0.0.1 --directory "$RUNNER_TEMP/cursor-site" > /tmp/cursor-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8767/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/cursor-tools/node_modules" BASE_URL=http://127.0.0.1:8767 ARTIFACT_DIR="$RUNNER_TEMP/cursor-evidence" node scripts/cursor-temporal.cjs
          python scripts/check-cursor-pixels.py "$RUNNER_TEMP/cursor-evidence"
      - name: Preserve cursor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-evidence
          path: ${{ runner.temp }}/cursor-evidence/
