<section class="comments" aria-labelledby="comments-heading">
  <div class="sec-head">
    <h2 id="comments-heading">Comments</h2>
    <div class="line"></div>
  </div>
  <p class="comments-intro">Join the discussion with your GitHub account.</p>

  <script id="giscus-script"
          src="https://giscus.app/client.js"
          data-repo="Techdox/techdox"
          data-repo-id="R_kgDOJocvfw"
          data-category="Announcements"
          data-category-id="DIC_kwDOJocvf84DBPjO"
          data-mapping="pathname"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="dark_dimmed"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <script>
    (() => {
      const giscusTheme = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark_dimmed';
      const syncGiscusTheme = () => {
        const frame = document.querySelector('iframe.giscus-frame');
        if (!frame) return;
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: giscusTheme() } } },
          'https://giscus.app'
        );
      };

      document.getElementById('giscus-script').addEventListener('load', syncGiscusTheme);
      new MutationObserver(syncGiscusTheme).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
    })();
  </script>
</section>
