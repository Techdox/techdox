<a class="card" href="{{ .RelPermalink }}">
  {{ with .Params.tags }}<span class="tag">{{ index . 0 }}</span>{{ end }}
  <h3>{{ .Title }}</h3>
  <p>{{ with .Description }}{{ . | plainify | htmlUnescape | truncate 180 }}{{ else }}{{ .Summary | plainify | htmlUnescape | truncate 180 }}{{ end }}</p>
  <div class="meta">{{ .Date.Format "Jan 2, 2006" }} <span class="dot"></span> {{ .ReadingTime }} min read</div>
</a>
