<footer>
  <div class="foot-grid">
    <div>
      <a class="brand" href="{{ "/" | relURL }}" aria-label="Techdox blog home">{{ partial "brand.html" . }}</a>
      <p class="foot-tag">Practical self-hosting, from my own homelab.</p>
    </div>
    <div class="foot-links">
      <div class="foot-col">
        <h5>Site</h5>
        <a href="https://techdox.nz/">Techdox home</a>
        <a href="{{ "/" | relURL }}">Blog home</a>
        <a href="{{ "/posts/" | relURL }}">Posts</a>
        <a href="{{ "/tags/" | relURL }}">Tags</a>
        <a href="/search/">Search</a>
        <a href="/index.xml">RSS</a>
      </div>
      <div class="foot-col">
        <h5>Elsewhere</h5>
        {{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      </div>
    </div>
  </div>
  <div class="copyright">© {{ now.Year }} {{ .Site.Title }} — written in the lab, published with Hugo.</div>
</footer>
