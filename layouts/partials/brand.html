{{/* The SVG masters include surplus transparent canvas. CSS crops only that
     canvas, never the outlined artwork or its attached cursor; web-only derivatives animate that rect. */}}
<span class="brand-mark" aria-hidden="true">
  <picture class="wordmark-picture"><source media="(prefers-reduced-motion: reduce)" srcset="/brand/primary-dark.svg"><img class="brand-dark" src="/brand/wordmark-web-dark.svg" width="960" height="180" alt=""></picture>
  <picture class="wordmark-picture"><source media="(prefers-reduced-motion: reduce)" srcset="/brand/primary-light.svg"><img class="brand-light" src="/brand/wordmark-web-light.svg" width="960" height="180" alt=""></picture>
</span>
